<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>画面イメージ v16 突破の演出</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--num:'Barlow Condensed',sans-serif;--ja:'Zen Kaku Gothic New',system-ui,sans-serif;
  --paper:#F6F7F9;--ai:#1C2B4B;--shu:#D03C22;--shu-on-ai:#FF6A4D;--mute:#5E6B82;--hair:#DDE2EA}
*{box-sizing:border-box;margin:0}
body{background:#C9CED6;color:var(--ai);font:16px/1.6 var(--ja);padding:24px 16px}
.intro{max-width:1240px;margin:0 auto 18px}.intro h1{font:900 28px var(--ja)}.intro p{color:#222;max-width:900px}
.wall{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
figure{width:340px;max-width:100%}figcaption{font-size:13px;color:#111;margin:0 4px 8px;line-height:1.5}
figcaption b{font-size:16px}
.phone{position:relative;border-radius:30px;height:420px;overflow:hidden;background:var(--paper);padding:26px 22px}
.num{font-family:var(--num);font-weight:700;line-height:.88}
.exname{font:900 30px/1.15 var(--ja)}
.prev{font:600 17px var(--num);color:var(--mute);margin-top:4px}
.again{margin-top:10px;width:100%;min-height:44px;border:0;border-radius:14px;background:var(--ai);color:#fff;font:700 15px var(--ja)}
.stage{position:relative;margin-top:16px;height:120px}

/* A 帯が落ちる（今のブランチ） */
.A .band{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;background:var(--shu);color:#fff;border-radius:20px;padding:14px 18px;animation:a-slam 520ms cubic-bezier(.2,1.5,.3,1) both}
.A .band::before{content:'';position:absolute;inset:0 auto 0 0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%) skewX(-18deg);animation:a-sweep 700ms ease-out 180ms both}
.A .band::after{content:'';position:absolute;left:52px;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:3px solid #fff;opacity:0;animation:a-ring 640ms ease-out 120ms both}
.A .band .num{font-size:72px;animation:a-num 560ms cubic-bezier(.2,1.6,.3,1) 80ms both}
.A .band b{font:900 30px/1 var(--ja);display:block;animation:a-word 520ms cubic-bezier(.2,1.2,.3,1) 100ms both}
.A .band small{font-size:13px;opacity:.9}
@keyframes a-slam{0%{transform:scale(1.5) rotate(-3deg);opacity:0}35%{opacity:1}55%{transform:scale(.97) rotate(.6deg)}100%{transform:none}}
@keyframes a-sweep{to{transform:translateX(330%) skewX(-18deg)}}
@keyframes a-ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3.2)}}
@keyframes a-num{0%{transform:scale(2.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes a-word{0%{transform:scale(1.7);letter-spacing:.35em;opacity:0}100%{transform:none;letter-spacing:0;opacity:1}}

/* B 判子 */
.B .row{display:flex;align-items:center;gap:18px}
.B .row .num{font-size:96px;color:var(--shu);animation:b-num 300ms ease-out both}
.B .hanko{width:108px;height:108px;border:5px solid var(--shu);border-radius:10px;color:var(--shu);font:900 34px/1.05 var(--ja);display:flex;align-items:center;justify-content:center;text-align:center;
  transform:rotate(-8deg);animation:b-press 460ms cubic-bezier(.3,0,.2,1) 260ms both;
  -webkit-mask:radial-gradient(circle at 30% 70%,#000 60%,transparent 61%) 0 0/9px 9px,linear-gradient(#000,#000);-webkit-mask-composite:source-over}
.B .phone{animation:b-shake 220ms ease-out 560ms both}
.B small{display:block;font-size:13px;color:var(--mute);margin-top:6px;animation:b-fade 300ms ease-out 800ms both}
@keyframes b-num{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes b-press{0%{opacity:0;transform:scale(3) rotate(-20deg)}70%{opacity:1;transform:scale(.92) rotate(-7deg)}100%{transform:scale(1) rotate(-8deg)}}
@keyframes b-shake{0%{transform:translateY(0)}30%{transform:translateY(4px)}60%{transform:translateY(-2px)}100%{transform:none}}
@keyframes b-fade{from{opacity:0}to{opacity:1}}

/* C ラインを突き破る */
.C .line{position:absolute;left:0;right:0;top:64px;height:0;display:flex}
.C .line i{flex:1;border-top:3px dashed var(--mute);position:relative}
.C .line i:first-child{animation:c-l 500ms cubic-bezier(.2,.8,.3,1) 420ms both}
.C .line i:last-child{animation:c-r 500ms cubic-bezier(.2,.8,.3,1) 420ms both}
.C .line span{position:absolute;right:0;top:-26px;font:700 13px var(--ja);color:var(--mute);animation:b-fade 200ms reverse 420ms both}
.C .up{position:absolute;left:0;right:0;top:0;text-align:center;animation:c-up 560ms cubic-bezier(.3,1.5,.4,1) 120ms both}
.C .up .num{font-size:110px;color:var(--shu)}
.C .word{position:absolute;left:0;right:0;top:104px;text-align:center;font:900 30px var(--ja);color:var(--shu);letter-spacing:.2em;animation:c-word 400ms cubic-bezier(.2,1.4,.3,1) 600ms both}
@keyframes c-up{0%{transform:translateY(110px);opacity:0}100%{transform:none;opacity:1}}
@keyframes c-l{to{transform:translate(-60px,14px) rotate(-12deg);opacity:0}}
@keyframes c-r{to{transform:translate(60px,14px) rotate(12deg);opacity:0}}
@keyframes c-word{0%{transform:scale(2);opacity:0}100%{transform:none;opacity:1}}

/* D 全面 */
.D .flood{position:absolute;inset:0;background:var(--shu);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;animation:d-flood 1300ms cubic-bezier(.6,0,.2,1) both}
.D .flood b{font:900 110px/1 var(--ja);animation:d-word 1300ms cubic-bezier(.2,1.3,.3,1) both}
.D .flood .num{font-size:60px;margin-top:8px;animation:b-fade 300ms ease-out 200ms both}
.D .band{display:flex;align-items:center;gap:14px;background:var(--shu);color:#fff;border-radius:20px;padding:14px 18px}
.D .band .num{font-size:72px}.D .band b{font:900 30px/1 var(--ja);display:block}.D .band small{font-size:13px;opacity:.9}
@keyframes d-flood{0%{clip-path:circle(0% at 50% 60%)}25%{clip-path:circle(80% at 50% 60%)}70%{clip-path:circle(80% at 50% 60%);opacity:1}100%{clip-path:circle(80% at 50% 60%);opacity:0;visibility:hidden}}
@keyframes d-word{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}70%{transform:scale(1.04)}100%{transform:scale(.4) translateY(80px);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head><body>
<div class="intro"><h1>突破の演出 ─ 候補</h1><p>1セット目がラインを超えて「完了」を押した瞬間。どれも色は藍・朱・白のまま。「もう一度」で何度でも再生。自己ベストは選んだ案を藍の地で同じ動きにします。</p></div>
<div class="wall">

<figure class="A"><figcaption><b>A 帯が落ちる</b>（いまブランチにある案）<br>朱の帯が上から叩きつけられ、光が走り、数字から輪が広がる。</figcaption>
<div class="phone"><h1 class="exname">腕立て伏せ</h1><p class="prev">ライン 17 ・ 突破</p>
<div class="stage"><div class="band"><span class="num">18</span><div><b>突破</b><small>次のライン 18</small></div></div></div></div>
<button class="again">もう一度</button></figure>

<figure class="B"><figcaption><b>B 判子</b><br>数字の横に朱の判子「突破」がドンと押される。押した瞬間に紙が少し沈む。まとめ画面の判子と同じ印。</figcaption>
<div class="phone"><h1 class="exname">腕立て伏せ</h1><p class="prev">ライン 17</p>
<div class="stage"><div class="row"><span class="num">18</span><div class="hanko">突<br>破</div></div><small>次のライン 18</small></div></div>
<button class="again">もう一度</button></figure>

<figure class="C"><figcaption><b>C ラインを突き破る</b><br>点線のライン17を、下から18が突き上げて割る。割れた線が左右に飛んで「突破」。アプリの仕組みそのままの絵。</figcaption>
<div class="phone"><h1 class="exname">腕立て伏せ</h1><p class="prev">次のライン 18</p>
<div class="stage" style="height:160px"><div class="line"><i></i><i><span>ライン 17</span></i></div><div class="up"><span class="num">18</span></div><div class="word">突破</div></div></div>
<button class="again">もう一度</button></figure>

<figure class="D"><figcaption><b>D 全面</b><br>画面いっぱいが一瞬朱になり大きな「突破」。縮んで下の帯に収まる。いちばん派手。毎回だとくどいかも。</figcaption>
<div class="phone"><h1 class="exname">腕立て伏せ</h1><p class="prev">ライン 17 ・ 突破</p>
<div class="stage"><div class="band"><span class="num">18</span><div><b>突破</b><small>次のライン 18</small></div></div></div>
<div class="flood"><b>突破</b><span class="num">18</span></div></div>
<button class="again">もう一度</button></figure>

</div>
<script>
// replay: clone the phone so every animation restarts
for (const b of document.querySelectorAll('.again')) b.onclick = () => {
  const p = b.previousElementSibling; p.replaceWith(p.cloneNode(true));
};
</script>
</body></html>
