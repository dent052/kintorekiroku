<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1C2B4B">
  <title>筋トレ記録</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app" data-mode="today">
    <section class="see" aria-label="記録"></section>
    <section class="press" aria-label="操作"></section>
    <nav class="tabs" aria-label="画面切り替え"></nav>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" class="sheet" aria-labelledby="confirm-text">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" autofocus>キャンセル</button>
        <button type="submit" value="confirm" class="go">確認</button>
      </div>
    </form>
  </dialog>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
